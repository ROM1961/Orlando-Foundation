services:
  # MongoDB Database
  - type: pserv
    name: vault-wallet-mongodb
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile.mongo
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 10

  # Backend API (FastAPI)
  - type: web
    name: vault-wallet-backend
    env: python
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: vault_wallet
      - key: CORS_ORIGINS
        value: "*"
      - key: ALCHEMY_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: ACS_TOKEN
        value: "0x1769AA7B5B4AAe76B7E6D797B379c21cAE12c46d"
      - key: ACS_PRICE_FEED
        value: "0x359767f0CE82592eED2F13F19B0252eB539C2A2D"
      - key: AAVE_POOL
        value: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
      - key: COMPOUND_COMET
        value: "0xA17581A9E3356d9A858b789D68B4d866e593aE94"

  # Frontend (React)
  - type: web
    name: vault-wallet-frontend
    env: static
    plan: starter
    buildCommand: cd frontend && yarn install && yarn build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: vault-wallet-backend
          property: host
      - key: REACT_APP_ALCHEMY_API_KEY
        sync: false
      - key: REACT_APP_AAVE_POOL
        value: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
      - key: REACT_APP_COMPOUND_COMET
        value: "0xA17581A9E3356d9A858b789D68B4d866e593aE94"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
